<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SENDROP Administration</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FFC400;--yd:#D9A000;--ink:#17150E;--mut:#6C6858;--ln:#EADFB3;--tint:#FFF8DC;--bg:#FFFCF0;--err:#B3261E;--ok:#1E7B3A}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:400 15px/1.5 Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3,.brand b{font-family:'Bricolage Grotesque',Manrope,system-ui,sans-serif;letter-spacing:-.03em}
h1{font-size:2rem;font-weight:800;margin:0}h2{font-size:1.4rem;font-weight:800;margin:0 0 14px}h3{margin:14px 0 8px}
.mut{color:var(--mut)}.login{max-width:420px;margin:10vh auto;padding:0 20px}
.logo{display:block;overflow:visible}.logo .bx{transform-origin:32px 56px;animation:hop 1.9s ease-in-out infinite}.logo .sh{transform-origin:32px 59px;animation:shd 1.9s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}28%{transform:translateY(-7px) rotate(-4deg)}55%{transform:translateY(-2px) rotate(3deg)}78%{transform:translateY(-4px) rotate(-1deg)}}
@keyframes shd{0%,100%{transform:scaleX(1);opacity:.25}28%{transform:scaleX(.7);opacity:.12}55%{transform:scaleX(.9);opacity:.2}}
@media(prefers-reduced-motion:reduce){.logo *{animation:none!important}}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}.brand .logo{width:60px;height:60px}.brand div{display:flex;flex-direction:column;line-height:1.1}.brand b{font-size:1.5rem}.brand span{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:100%}
aside{background:var(--y);color:var(--ink);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{padding:0 8px 14px}aside .brand .logo{width:46px;height:46px}aside .brand b{font-size:1.3rem}
aside button{display:block;width:100%;text-align:left;background:none;color:var(--ink);border:0;padding:10px 12px;border-radius:10px;font:700 .93rem Manrope,sans-serif;cursor:pointer}
aside button:hover{background:#FFD84D}aside button.on{background:#fff;box-shadow:0 2px 0 var(--yd)}aside .out{margin-top:20px;border:1.5px solid var(--ink)}
main{padding:24px;min-width:0}
.card{background:#fff;border:1.5px solid var(--ln);border-radius:14px;padding:16px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.grid .card{margin:0;border-top:5px solid var(--y)}.grid b{display:block;font-family:'Bricolage Grotesque',Manrope,sans-serif;font-size:1.9rem;font-weight:800;line-height:1.15}
label{display:block;font-weight:600;font-size:.85rem;margin:0 0 10px}
input,select,textarea{width:100%;font:inherit;padding:9px 11px;margin-top:4px;border:1.5px solid var(--ln);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--y);outline:3px solid #FFE88A}
button.b{font:800 .9rem Manrope,sans-serif;border:0;border-radius:10px;padding:9px 14px;background:var(--y);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--yd)}
button.b.g{background:#fff;color:var(--ink);border:1.5px solid var(--ink);box-shadow:none}button.b.r{background:var(--err);color:#fff;box-shadow:none}button.b.k{background:var(--ink);color:var(--y);box-shadow:none}button.b:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 1 auto}.row input,.row select{width:auto;min-width:160px;margin:0}
.badge{display:inline-block;background:var(--tint);border:1px solid var(--y);font-weight:700;font-size:.74rem;padding:2px 9px;border-radius:99px}
.badge.ok{background:#D7F0E0;border-color:#9BD3AE;color:#14502A}.badge.bad{background:#F8DAD7;border-color:#E6A39D;color:#8C1D18}.badge.w{background:#FFEFB0;border-color:var(--y);color:#5A4300}
.tbl{width:100%;border-collapse:collapse}.tbl td,.tbl th{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}.tbl th{font-size:.78rem;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}.err{color:var(--err);min-height:1.3em}
#toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:80%}
@media(max-width:760px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px}aside .brand{width:100%}aside button{width:auto}main{padding:16px}}
</style></head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SBU='https://tjcaznqcqoevwnuievkl.supabase.co',KEY='sb_publishable_IL0vaCubk7751fe-TFWnQw_AN2gYM5X';
const sb=supabase.createClient(SBU,KEY);
const $=(s,e=document)=>e.querySelector(s),app=$('#app');
const LOGO='<svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Sendrop"><ellipse class="sh" cx="32" cy="59" rx="17" ry="3" fill="#17150E" opacity=".25"/><g class="bx" stroke="#17150E" stroke-width="2.2" stroke-linejoin="round"><path d="M10 22 L32 32 L32 56 L10 46 Z" fill="#F2B705"/><path d="M32 32 L54 22 L54 46 L32 56 Z" fill="#E0A100"/><path d="M32 12 L54 22 L32 32 L10 22 Z" fill="#FFD84D"/><path d="M21 17 L43 27" stroke="#fff" stroke-width="6"/><path d="M32 12 L54 22 L32 32 L10 22 Z" fill="none"/><path d="M38 41 L48 36.5 L48 43 L38 47.5 Z" fill="#fff" stroke-width="1.6"/></g></svg>';
{const l=document.createElement('link');l.rel='icon';l.href='data:image/svg+xml,'+encodeURIComponent(LOGO);document.head.append(l)}

const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(d).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'}):'';
const nm=p=>p?`${esc(p.first_name||'')} ${esc(p.last_name||'')}`.trim():'-';
const DS={pending:'À compléter',under_review:'En vérification',approved:'Approuvé',rejected:'Refusé',correction_required:'Correction demandée',suspended:'Suspendu'};
const OS={pending:'En attente',searching_driver:'Recherche livreur',driver_assigned:'Livreur assigné',driver_arriving:'En route',driver_arrived:'Arrivé',picked_up:'Récupéré',in_transit:'En livraison',delivered:'Livré',cancelled:'Annulé',disputed:'Litige'};
const CS={pending:'En attente',valid:'Valide',expired:'Expiré',needs_review:'À revoir',rejected:'Refusé'};
const DT={id_card:"Carte d'identité",passport:'Passeport',license:'Permis',insurance:'Assurance'};
const RC={delivery:'Problème de livraison',suspicious:'Comportement suspect',not_received:'Colis non reçu',fraud:'Fraude',payment:'Problème de paiement',safety:'Problème de sécurité',other:'Autre'};
const RS={open:'Ouvert',in_progress:'En cours',resolved:'Résolu',closed:'Clôturé'};
let adm,main,cur;
function toast(t){const e=document.createElement('div');e.id='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3500)}
async function pwned(pw){try{const h=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-1',new TextEncoder().encode(pw)))).map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();
 const r=await fetch('https://api.pwnedpasswords.com/range/'+h.slice(0,5),{headers:{'Add-Padding':'true'}});if(!r.ok)return false;
 return(await r.text()).split('\n').some(l=>{const[x,c]=l.trim().split(':');return x===h.slice(5)&&parseInt(c)>0})}catch{return false}}
const can=p=>adm&&(adm.is_super||adm.permissions.includes(p));
const log=(a,t,i,m)=>sb.rpc('admin_log',{p_action:a,p_type:t,p_target:String(i||''),p_meta:m||null});
const empty=t=>`<div class="card mut">${t}</div>`;

/* ---------- Connexion ---------- */
function viewLogin(msg=''){
 app.innerHTML=`<div class="login"><div class="brand">${LOGO}<div><b>SENDROP</b><span>Administration</span></div></div><p class="mut">Accès réservé.</p><form id="f" class="card"><label>Email<input id="em" type="email" required autocomplete="username"></label>
 <label>Mot de passe<input id="pw" type="password" required autocomplete="current-password"></label><p class="err" id="e">${esc(msg)}</p><button class="b" id="b">Se connecter</button></form></div>`;
 $('#f').onsubmit=async ev=>{ev.preventDefault();$('#b').disabled=true;
  const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){$('#b').disabled=false;$('#e').textContent='Identifiants incorrects.';return}start()}}
async function start(){
 const{data:{session}}=await sb.auth.getSession();if(!session)return viewLogin();
 const{data:a}=await sb.from('admin_users').select('*').eq('id',session.user.id).maybeSingle();
 if(!a||!a.active){await sb.auth.signOut();return viewLogin('Accès refusé.')}
 adm=a;if(a.must_change_password)return viewChange();shell()}
function viewChange(msg=''){
 app.innerHTML=`<div class="login"><h1>Nouveau mot de passe</h1><p class="mut">Pour votre sécurité, définissez un mot de passe personnel avant de continuer : 12 caractères minimum, avec majuscule, minuscule et chiffre.</p>
 <form id="f" class="card"><label>Nouveau mot de passe<input id="p1" type="password" required autocomplete="new-password"></label><label>Confirmer<input id="p2" type="password" required autocomplete="new-password"></label>
 <p class="err" id="e">${esc(msg)}</p><button class="b">Enregistrer</button></form></div>`;
 $('#f').onsubmit=async ev=>{ev.preventDefault();const a=$('#p1').value;
  if(a!==$('#p2').value)return $('#e').textContent='Les deux mots de passe sont différents.';
  if(a.length<12||!/[a-z]/.test(a)||!/[A-Z]/.test(a)||!/\d/.test(a))return $('#e').textContent='Mot de passe trop faible.';
  if(await pwned(a))return $('#e').textContent='Ce mot de passe apparaît dans des fuites de données. Choisissez-en un autre.';
  const{error}=await sb.auth.updateUser({password:a});if(error)return $('#e').textContent='Changement impossible. Utilisez un mot de passe différent.';
  await sb.rpc('complete_password_change');start()}}

/* ---------- Structure ---------- */
const TABS=[['dc','Tableau de bord clients',null],['dd','Tableau de bord livreurs',null],['drv','Livreurs','view_drivers'],['usr','Utilisateurs','view_users'],['rep','Signalements et urgences','view_reports'],['fr','Alertes de fraude','view_reports'],['sub','Abonnements','manage_subscriptions'],['set','Tarifs','manage_settings'],['col','Collaborateurs','manage_collaborators'],['conn','Connexions','manage_settings'],['ntf','Notifications','send_notifications'],['log','Journal d\'activité','view_activity_logs']];
function shell(){
 app.innerHTML=`<div class="layout"><aside><div class="brand">${LOGO}<div><b>SENDROP</b><span>Administration</span></div></div>${TABS.filter(t=>!t[2]||can(t[2])).map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('')}<button class="out" id="lo">Se déconnecter</button></aside><main id="main"></main></div>`;
 main=$('#main');$('aside').onclick=e=>{const b=e.target.closest('button[data-t]');if(b)go(b.dataset.t)};
 sb.channel('adm').on('postgres_changes',{event:'INSERT',schema:'public',table:'emergency_requests'},()=>{toast('Nouvelle urgence reçue');if(cur==='rep')go('rep')}).on('postgres_changes',{event:'INSERT',schema:'public',table:'reports'},()=>{toast('Nouveau signalement reçu');if(cur==='rep')go('rep')}).on('postgres_changes',{event:'INSERT',schema:'public',table:'fraud_alerts'},()=>{toast('Nouvelle alerte de fraude');if(cur==='fr')go('fr')}).subscribe();
 $('#lo').onclick=async()=>{await sb.auth.signOut();sb.removeAllChannels();adm=null;viewLogin()};go('dc')}
function go(t){cur=t;document.querySelectorAll('aside button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));main.onclick=null;main.innerHTML='<p class="mut">Chargement...</p>';({dc:vDc,dd:vDd,drv:vDrv,usr:vUsr,rep:vRep,sub:vSub,set:vSet,col:vCol,fr:vFr,conn:vConn,ntf:vNtf,log:vLog})[t]()}
const st=async()=>(await sb.rpc('admin_stats')).data;
const kp=(n,l)=>`<div class="card"><b>${n}</b>${l}</div>`;
const none='<p class="mut">Aucune donnée disponible.</p>';

/* ---------- Dashboards ---------- */
async function vDc(){const s=await st();if(!s)return main.innerHTML=empty('Statistiques indisponibles.');
 main.innerHTML=`<h2>Tableau de bord clients</h2><div class="grid">${kp(s.clients,'Clients inscrits')}${kp(s.active_clients_today,'Clients actifs aujourd\'hui')}${kp(s.orders,'Commandes')}${kp(s.orders_today,'Commandes aujourd\'hui')}${kp(s.cancelled,'Annulations')}${kp(s.avg_rating??'-','Satisfaction (note moyenne)')}${kp(s.open_reports,'Signalements ouverts')}${kp(s.open_emergencies,'Urgences ouvertes')}</div>
 <div class="card"><b>Commandes par statut</b>${Object.keys(s.by_status).length?`<table class="tbl">${Object.entries(s.by_status).map(([k,v])=>`<tr><td>${OS[k]||k}</td><td>${v}</td></tr>`).join('')}</table>`:none}</div>`}
async function vDd(){const s=await st();if(!s)return main.innerHTML=empty('Statistiques indisponibles.');
 const d=s.drivers_by_status;
 main.innerHTML=`<h2>Tableau de bord livreurs</h2><div class="grid">${kp(s.drivers,'Livreurs inscrits')}${kp(s.active_drivers_today,'Livreurs actifs aujourd\'hui')}${kp(s.delivered,'Livraisons terminées')}${kp(s.revenue?s.revenue.toLocaleString('fr-FR')+' FCFA':'-','Revenus des livraisons')}${kp(d.under_review||0,'Dossiers à vérifier')}${kp(d.approved||0,'Livreurs approuvés')}${kp(d.suspended||0,'Livreurs suspendus')}</div>
 <div class="card"><b>Dossiers par statut</b>${Object.keys(d).length?`<table class="tbl">${Object.entries(d).map(([k,v])=>`<tr><td>${DS[k]||k}</td><td>${v}</td></tr>`).join('')}</table>`:none}</div>`}

/* ---------- Livreurs ---------- */
async function vDrv(){
 main.innerHTML=`<h2>Livreurs</h2><div class="row card"><select id="fs"><option value="">Tous les statuts</option>${Object.entries(DS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><button class="b g" id="rf">Actualiser</button></div><div id="l"></div><div id="d"></div>`;
 const load=async()=>{let q=sb.from('drivers').select('id,status,vehicle_type,city,created_at,profiles(first_name,last_name,phone)').order('created_at',{ascending:false}).limit(40);
  if($('#fs').value)q=q.eq('status',$('#fs').value);const{data}=await q;
  $('#l').innerHTML=(data||[]).length?`<div class="card scroll"><table class="tbl"><tr><th>Livreur</th><th>Téléphone</th><th>Véhicule</th><th>Ville</th><th>Statut</th><th></th></tr>${data.map(r=>`<tr><td>${nm(r.profiles)}</td><td>${esc(r.profiles?.phone)}</td><td>${esc(r.vehicle_type)}</td><td>${esc(r.city)}</td><td><span class="badge ${r.status==='approved'?'ok':r.status==='under_review'?'w':''}">${DS[r.status]}</span></td><td><button class="b g" data-id="${r.id}">Ouvrir le dossier</button></td></tr>`).join('')}</table></div>`:empty('Aucun livreur pour ce filtre.')};
 $('#fs').onchange=load;$('#rf').onclick=load;
 $('#l').onclick=e=>{const b=e.target.closest('[data-id]');if(b)detail(b.dataset.id)};load()}
const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
async function ocr(url){if(!window.Tesseract){await new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=ok;sc.onerror=ko;document.head.append(sc)})}
 return (await Tesseract.recognize(url,'fra')).data.text}
function analyse(text,d,x){const T=norm(text),flat=T.replace(/\s/g,''),dates=[];
 for(const m of T.matchAll(/(\d{2})[\/.\- ](\d{2})[\/.\- ](\d{4})/g))dates.push(`${m[3]}-${m[2]}-${m[1]}`);
 const det={prenom:T.includes(norm(d.profiles?.first_name)),nom:T.includes(norm(d.profiles?.last_name)),expiration:dates.includes(x.expires_at),numero:!!x.doc_number&&flat.includes(norm(x.doc_number).replace(/\s/g,'')),dates_lues:dates.slice(0,6)};
 det.verdict=T.replace(/\s/g,'').length<25?'illisible':(det.prenom&&det.nom&&det.expiration?'coherent':'incoherent');return det}
async function detail(id){
 const[{data:d},{data:docs}]=await Promise.all([sb.from('drivers').select('*,profiles(first_name,last_name,phone)').eq('id',id).single(),sb.from('driver_documents').select('*').eq('driver_id',id).order('created_at',{ascending:false})]);
 const paths=[...(d.photo_path?[d.photo_path]:[]),...(docs||[]).map(x=>x.file_path)];
 const urls={};if(paths.length){const{data:s}=await sb.storage.from('private-docs').createSignedUrls(paths,300);(s||[]).forEach(x=>urls[x.path]=x.signedUrl)}
 const el=$('#d');
 el.innerHTML=`<div class="card"><h3>${nm(d.profiles)} <span class="badge">${DS[d.status]}</span></h3><p>Téléphone : ${esc(d.profiles?.phone)}<br>Naissance : ${esc(d.birth_date)} - Adresse : ${esc(d.address)}, ${esc(d.city)}<br>Véhicule : ${esc(d.vehicle_type)} - Note : ${d.rating_count?d.rating_avg:'aucune'}</p>
 <p>Photo : ${d.photo_path&&urls[d.photo_path]?`<a href="${urls[d.photo_path]}" target="_blank" rel="noopener">Ouvrir la photo</a>`:'<span class="badge bad">Manquante</span>'}</p>
 <p class="mut">Les noms et dates sont à comparer manuellement avec les documents. Aucune lecture automatique (OCR) n'est branchée : seule l'expiration est contrôlée automatiquement.</p>
 <div class="scroll"><table class="tbl"><tr><th>Document</th><th>Numéro</th><th>Titulaire / compagnie</th><th>Validité</th><th>Statut</th><th></th></tr>${(docs||[]).map(x=>`<tr><td>${DT[x.doc_type]}<br>${urls[x.file_path]?`<a href="${urls[x.file_path]}" target="_blank" rel="noopener">Ouvrir</a>`:''}${/\.pdf$/i.test(x.file_path)||!urls[x.file_path]?'':` <button class="b g" data-ocr="${x.id}" data-u="${urls[x.file_path]}">Analyser (OCR)</button>`}${x.detected?`<br><span class="badge ${x.detected.verdict==='coherent'?'ok':'w'}" title="${esc(JSON.stringify(x.detected))}">OCR : ${esc(x.detected.verdict)}</span>`:''}</td><td>${esc(x.doc_number)}</td><td>${esc(x.holder_name||x.provider)}</td><td>${esc(x.starts_at||'')} au ${esc(x.expires_at)}</td><td><span class="badge ${x.check_status==='valid'?'ok':x.check_status==='pending'||x.check_status==='needs_review'?'w':'bad'}">${CS[x.check_status]}</span></td><td>${can('verify_drivers')?`<button class="b k" data-ds="valid" data-x="${x.id}">Valide</button> <button class="b g" data-ds="needs_review" data-x="${x.id}">À revoir</button> <button class="b r" data-ds="rejected" data-x="${x.id}">Refuser</button>`:''}</td></tr>`).join('')||`<tr><td colspan="6">${none}</td></tr>`}</table></div></div>
 ${can('verify_drivers')?`<div class="card row"><button class="b k" data-s="approved">Approuver</button><button class="b g" data-s="correction_required">Demander une correction</button><button class="b r" data-s="rejected">Refuser</button><button class="b r" data-s="suspended">Suspendre</button></div>`:''}`;
 el.scrollIntoView({behavior:'smooth'});
 el.onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ocr){const x=docs.find(z=>z.id===b.dataset.ocr);b.disabled=true;b.textContent='Analyse en cours...';
   try{const r=analyse(await ocr(b.dataset.u),d,x);r.analyse_le=new Date().toISOString();
    const{error}=await sb.from('driver_documents').update({detected:r,check_status:r.verdict==='coherent'?x.check_status:'needs_review'}).eq('id',x.id);if(error)throw 0;
    await log('document_ocr','document',x.id,{verdict:r.verdict});toast('Analyse : '+r.verdict);return detail(id)}
   catch{b.disabled=false;b.textContent='Analyser (OCR)';toast('Analyse impossible. Ouvrez le document et vérifiez-le à la main.')}return}
  if(b.dataset.ds){const{error}=await sb.from('driver_documents').update({check_status:b.dataset.ds}).eq('id',b.dataset.x);if(error)return toast('Action impossible.');await log('document_'+b.dataset.ds,'document',b.dataset.x);return detail(id)}
  if(b.dataset.s){let note=null;if(b.dataset.s!=='approved'){note=prompt('Message pour le livreur (obligatoire) :');if(!note)return}
   const{error}=await sb.rpc('admin_review_driver',{p_driver:id,p_status:b.dataset.s,p_note:note});if(error)return toast(error.message);toast('Décision enregistrée');detail(id)}}}

/* ---------- Utilisateurs ---------- */
async function ban(id){
 const k=prompt('Type de bannissement : écrivez "temporaire" ou "permanent"');if(!k)return;
 const kind=k.toLowerCase().startsWith('t')?'temporary':'permanent';let days=null;
 if(kind==='temporary'){days=parseInt(prompt('Durée en jours :','7'),10);if(!days)return}
 const reason=prompt('Raison (obligatoire) :');if(!reason)return;

 main.onclick=async e=>{const b=e.target.closest('button');if(!b)return;

   $('#ed').innerHTML=`<div class="card"><b>Modifier ${esc(a.full_name)}</b><p></p><label>Rôle<input id="er" value="${esc(a.role_name||'')}"></label>${boxes(a.permissions,'e')}<label style="font-weight:400"><input type="checkbox" id="ea" style="width:auto;margin-right:8px" ${a.active?'checked':''}>Compte actif</label><button class="b" id="es" data-id="${a.id}">Enregistrer</button></div>`;$('#ed').scrollIntoView({behavior:'smooth'})}
  if(b.id==='es'){const{error}=await sb.rpc('admin_update_collaborator',{p_id:b.dataset.id,p_perms:picked('e'),p_active:$('#ea').checked,p_role:$('#er').value.trim()||null});toast(error?error.message:'Modifications enregistrées');if(!error)vCol()}}}

/* ---------- Notifications ---------- */
function vNtf(){
 main.innerHTML=`<h2>Campagne de notification</h2><form id="f" class="card"><label>Audience<select id="a"><option value="all_clients">Tous les clients</option><option value="all_drivers">Tous les livreurs</option><option value="premium_drivers">Livreurs abonnés</option><option value="free_drivers">Livreurs non abonnés</option></select></label>
 <label>Titre<input id="t" required maxlength="100"></label><label>Message<textarea id="m" rows="4" required></textarea></label><label>Expiration (facultatif)<input id="x" type="datetime-local"></label>
 <p class="mut">L'envoi est immédiat. Seuls les comptes actifs reçoivent la notification.</p><button class="b">Envoyer</button></form>`;
 $('#f').onsubmit=async ev=>{ev.preventDefault();if(!confirm('Envoyer cette notification maintenant ?'))return;
  const{data,error}=await sb.rpc('admin_send_campaign',{p_title:$('#t').value,p_body:$('#m').value,p_audience:$('#a').value,p_expires:$('#x').value?new Date($('#x').value).toISOString():null});
  if(error)return toast(error.message);toast(`Envoyée à ${data} destinataire(s)`);$('#f').reset()}}

/* ---------- Journal ---------- */
async function vLog(){
 const{data:ad}=await sb.from('admin_users').select('id,full_name,email');const who=Object.fromEntries((ad||[]).map(a=>[a.id,a.full_name||a.email]));
 let page=0;main.innerHTML=`<h2>Journal d'activité</h2><div class="row card"><input id="fa" placeholder="Filtrer par action (ex : ban)"><button class="b" id="fb">Filtrer</button></div><div class="card scroll"><table class="tbl" id="t"><tr><th>Date</th><th>Administrateur</th><th>Action</th><th>Cible</th><th>Détails</th></tr></table></div><button class="b g" id="mo" hidden>Voir plus</button>`;
 const load=async reset=>{if(reset){page=0;$('#t').innerHTML=$('#t').rows[0].outerHTML}
  let q=sb.from('admin_activity_logs').select('*').order('created_at',{ascending:false}).range(page*30,page*30+29);const f=$('#fa').value.trim();if(f)q=q.ilike('action',`%${f}%`);
  const{data}=await q;$('#t').insertAdjacentHTML('beforeend',(data||[]).map(l=>`<tr><td>${fmt(l.created_at)}</td><td>${esc(who[l.admin_id]||l.admin_id||'-')}</td><td>${esc(l.action)}</td><td>${esc(l.target_type||'')} ${esc((l.target_id||'').slice(0,8))}</td><td>${esc(l.metadata?JSON.stringify(l.metadata):'')}</td></tr>`).join(''));
  if(page===0&&!(data||[]).length)$('#t').insertAdjacentHTML('beforeend','<tr><td colspan="5" class="mut">Aucune donnée disponible.</td></tr>');
  $('#mo').hidden=(data||[]).length<30;page++};
 $('#fb').onclick=()=>load(true);$('#mo').onclick=()=>load(false);load(false)}
start();
</script></body></html>
